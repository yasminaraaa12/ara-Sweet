<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ara'Sweet — Marketplace UMKM makanan & minuman: katalog pembeli, dashboard penjual, dan panel admin.">
    <meta name="theme-color" content="#DB2777">
    <title>ara'Sweet — Marketplace UMKM Dessert & Minuman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css?v=1.0.0">
</head>
<body>
    <!-- Splash / boot -->
    <div id="boot-screen" class="boot">
        <div class="boot__logo">🧁</div>
        <p class="boot__title">ara'Sweet</p>
        <p class="boot__text">Menyiapkan data toko…</p>
    </div>

    <!-- ================= AUTH (LOGIN / DAFTAR) ================= -->
    <div id="auth-screen" class="auth hidden"></div>

    <!-- ================= APP SHELL ================= -->
    <div id="app-shell" class="shell hidden">
        <div id="sidebar-scrim" class="scrim" onclick="App.toggleSidebar(false)"></div>
        <aside id="sidebar" class="sidebar"></aside>
        <div class="shell__main">
            <header id="appbar" class="appbar"></header>
            <main id="app-main" class="content"></main>
            <footer class="footer">
                <span><strong>ara'Sweet</strong> · Marketplace UMKM Dessert &amp; Minuman</span>
                <span>Data demo tersimpan lokal di browser (localStorage) · <span id="footer-year"></span></span>
            </footer>
        </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

    <script>window.Actions = {};</script>
    <script src="assets/js/ui.js?v=1.0.0"></script>
    <script src="assets/js/data.js?v=1.0.0"></script>
    <script src="assets/js/auth.js?v=1.0.0"></script>
    <script src="assets/js/views/buyer.js?v=1.0.0"></script>
    <script src="assets/js/views/seller.js?v=1.0.0"></script>
    <script src="assets/js/views/admin.js?v=1.0.0"></script>
    <script src="assets/js/app.js?v=1.0.0"></script>
</body>
</html>
